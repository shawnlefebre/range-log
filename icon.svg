<?xml version="1.0" encoding="UTF-8"?>
<!--
  Range Log app icon — the source of truth. The PNGs beside it are generated from this file
  by `node tools/make-icons.js`; edit here, never the PNGs.

  Neutral rings, gold group: the app's own convention that gold marks the meaningful thing
  and structure stays neutral. The holes are drawn larger than a real target would put them
  so the cluster still reads at 60px, which is the size a phone actually draws.

  No rounded corners and no padding inset: iOS and Android apply their own mask, and a
  shape that rounds its own corners gets rounded twice.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#0e0e0e"/>
  <g fill="none" stroke="#4a4a4a" stroke-width="18">
    <circle cx="256" cy="262" r="168"/>
    <circle cx="256" cy="262" r="112"/>
    <circle cx="256" cy="262" r="56"/>
  </g>
  <circle cx="256" cy="262" r="11" fill="#4a4a4a"/>
  <g fill="#c8a84b">
    <circle cx="205" cy="196" r="30"/>
    <circle cx="266" cy="176" r="30"/>
    <circle cx="238" cy="243" r="30"/>
  </g>
</svg>
